
version: '3.8'


services:
  # Redis for production message history
  redis:
    image: redis:7-alpine
    container_name: production_rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rag_network
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  volumes:
    redis_data
    
  networks:
    rag_network:
      driver: bridge